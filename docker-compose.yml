# CodeTutor 云端部署编排：app + caddy(自动HTTPS)；PostgreSQL 为可选（--profile pg）
#
# 默认：SQLite（挂载卷 ./data 持久化，migrate-data.sh 迁移的本机数据直接可用）
# 切换 PostgreSQL：.env 里设 USE_PG=1，然后 docker compose --profile pg up -d
#   ⚠️ 引擎切换 = 空库起步（历史数据不自动搬运）；首次上云建议先用 SQLite 承接迁移数据
#
# 用法：docker compose build && docker compose up -d
#   备案前测试：IP:3000 直连；正式上线走 Caddy(80/443) 自动 HTTPS
services:
  app:
    image: codetutor-app:latest
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000" # 备案前用 IP:3000 直连测试；正式上线走 Caddy(80/443)，此映射可保留
    environment:
      NODE_ENV: production
      PORT: 3000
      # ---- SQLite 模式（默认，配合 migrate-data.sh 迁移的本机数据）----
      # ---- 要切 PostgreSQL：在 .env 设 USE_PG=1 并加 --profile pg ----
      DATABASE_URL: ${USE_PG:+postgres://codetutor:${POSTGRES_PASSWORD:-codetutor-pg-please-change}@db:5432/codetutor}
      # 反代（Caddy）转发 https；有独立前端/小程序跨域调用时才需要
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - ./data:/app/data # SQLite 库 / 会话密钥 / 用户数据（持久化，⚠️ 必须迁移本机 data/）
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

  # 可选：PostgreSQL（USE_PG=1 且 --profile pg 时启用）
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["pg"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codetutor}
      POSTGRES_USER: ${POSTGRES_USER:-codetutor}
      # ⚠️ 启用 PG（--profile pg）前务必在 .env 设置 POSTGRES_PASSWORD
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codetutor-pg-please-change}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codetutor} -d ${POSTGRES_DB:-codetutor}"]
      interval: 10s
      timeout: 5s
      retries: 6

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CODETUTOR_DOMAIN: ${CODETUTOR_DOMAIN:-study.aiedutalk.online}
      ACME_EMAIL: ${ACME_EMAIL:-admin@aiedutalk.online}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
