services:
  postgres:
    image: postgres:16-alpine
    container_name: codetutor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codetutor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      POSTGRES_DB: ${POSTGRES_DB:-codetutor}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 仅本机暴露，生产建议移除 ports 由应用容器内网直连
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codetutor} -d ${POSTGRES_DB:-codetutor}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: codetutor-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-codetutor}:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/${POSTGRES_DB:-codetutor}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "3000:3000"
    volumes:
      # 密钥与 SQLite（如未启用 PG）持久化
      - appdata:/app/data
    command: >
      sh -c "npm run build && npm start"

volumes:
  pgdata:
  appdata:
